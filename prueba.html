<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manos que hablan — Prueba GitHub Pages</title>
<style>
:root{--bg:#eef4ff;--card:#fff;--tx:#0b1f3a;--ac:#ffd400;--ok:#2ecc71;--bad:#ff5252;--nav:#dbe7ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,sans-serif}
#app{max-width:480px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;background:var(--nav);display:flex;justify-content:space-between;align-items:center;font-size:20px;position:sticky;top:0;z-index:2}
header button{width:auto;margin:0;background:var(--ac)}
#main{padding:12px 16px 90px;flex:1}
h2{color:#b28a00;margin-top:8px}
.card{background:var(--card);border-radius:18px;padding:16px;text-align:center;margin:10px 0;box-shadow:0 2px 8px #00000010}
.big{font-size:64px}.word{font-size:30px;font-weight:bold;color:#b28a00}.desc{font-size:18px;line-height:1.4}
button{border:0;border-radius:14px;padding:13px;background:var(--ac);font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.65;cursor:default}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
input{width:100%;padding:12px;font-size:18px;border:2px solid var(--ac);border-radius:12px;margin:5px 0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);background:var(--nav);padding:7px;display:flex;justify-content:space-around;z-index:3}
nav button{background:transparent;padding:10px 8px}
.mc{min-height:90px;font-size:22px}.ok{background:var(--ok)!important}.bad{background:var(--bad)!important}
.out{background:var(--card);padding:12px;border-radius:12px;text-align:center;font-size:22px;margin:10px 0;min-height:26px}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #aaa;text-align:left;font-size:14px}
.small{font-size:13px;opacity:.75}
</style>
</head>
<body>
<div id="app">
<header><b>🤟 Manos que hablan</b><button id="tema">🌙</button></header>
<main id="main"></main>
<nav id="nav" hidden></nav>
</div>

<script>
const SIGNS=[
["hola","👋","Mano abierta saludando."],["adiós","👋","Movimiento de despedida con la mano."],["gracias","🙏","Gesto de agradecimiento."],["por favor","🤲","Gesto amable para pedir algo."],["perdón","🙇","Gesto para pedir disculpas."],["sí","👍","Pulgar hacia arriba."],["no","👎","Pulgar hacia abajo."],["bien","😊","Expresa que algo está bien."],["mal","😞","Expresa que algo está mal."],["ayuda","🆘","Señal para pedir ayuda."],["yo","🙋","Señala a la propia persona."],["tú","👉","Señala a otra persona."],["mamá","👩","Seña relacionada con mamá."],["papá","👨","Seña relacionada con papá."],["bebé","👶","Seña relacionada con un bebé."],["amigo","🫂","Expresa amistad."],["maestro","🧑‍🏫","Persona que enseña."],["comer","🍴","Gesto relacionado con comer."],["beber","🥤","Gesto relacionado con beber."],["dormir","😴","Gesto relacionado con dormir."],["jugar","🎮","Actividad de jugar."],["correr","🏃","Actividad de correr."],["leer","📖","Actividad de leer."],["escribir","✍️","Actividad de escribir."],["caminar","🚶","Actividad de caminar."],["ver","👀","Gesto relacionado con mirar o ver."],["querer","❤️","Expresa querer o cariño."],["casa","🏠","Lugar donde vivimos."],["escuela","🏫","Lugar donde aprendemos."],["libro","📚","Objeto para leer."],["agua","💧","Bebida esencial."],["pan","🍞","Alimento."],["leche","🥛","Bebida."],["pelota","⚽","Objeto usado para jugar."],["carro","🚗","Medio de transporte."],["sol","☀️","Estrella que vemos de día."],["luna","🌙","Astro que vemos de noche."],["perro","🐶","Animal doméstico."],["gato","🐱","Animal doméstico."],["pájaro","🐦","Animal que vuela."],["pez","🐟","Animal que vive en el agua."],["feliz","😄","Expresa alegría."],["triste","😢","Expresa tristeza."],["enojado","😠","Expresa enojo."],["miedo","😨","Expresa temor."],["amor","❤️","Expresa cariño o amor."],["frío","🥶","Expresa sensación de frío."],["calor","🥵","Expresa sensación de calor."],["uno","1️⃣","Número uno."],["dos","2️⃣","Número dos."],["tres","3️⃣","Número tres."]
].map((x,i)=>({id:i,w:x[0],p:x[1],d:x[2]}));

const RANKS=[
[0,"🌱","Semilla"],[50,"🐥","Pollito"],[120,"🦋","Mariposa"],[220,"🐬","Delfín"],
[350,"🦁","León"],[520,"🦉","Búho sabio"],[750,"🦅","Águila"],[1000,"🏆","Campeón"],[1500,"👑","Maestro"]
];

const PHRASES=[
["yo","quiero","agua"],["mamá","quiero","pan"],["yo","como","pan"],
["tú","bebes","agua"],["amigo","jugar","pelota"],["yo","leo","libro"],
["mamá","y","papá"],["yo","veo","perro"],["quiero","leche"]
];

const KEY="mqh_github_prueba_v1";
let DB=JSON.parse(localStorage.getItem(KEY)||'{"users":{}}');
let U=null,S=[...SIGNS],mem=null,triv=null,phr=null;

const main=document.querySelector("#main"),nav=document.querySelector("#nav");
const save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rank(x){let r=RANKS[0];for(const a of RANKS)if(x>=a[0])r=a;return r}
function getUser(name){
  if(!DB.users[name]) DB.users[name]={name,xp:0,log:[]};
  return DB.users[name];
}
function addXP(amount,activity,correct,total){
  const u=getUser(U); u.xp+=amount;
  u.log.push({d:new Date().toLocaleString("es-ES"),a:activity,p:correct,t:total,xp:amount});
  save();
}
function navs(){
  if(!U){nav.hidden=true;return}
  nav.hidden=false;
  nav.innerHTML='<button onclick="menu()">🏠</button><button onclick="learn()">📖</button><button onclick="memory()">🧠</button><button onclick="trivia()">❓</button><button onclick="phrases()">🧩</button><button onclick="progress()">⭐</button>';
}
function login(){
  U=null;navs();
  main.innerHTML='<div class="card"><div class="big">🤟</div><h2>¡Bienvenido!</h2><p class="desc">Aprende señas jugando</p><input id="nombre" placeholder="Tu nombre" maxlength="20"><button style="width:100%" onclick="entrar()">▶ Entrar</button><button style="width:100%;margin-top:12px" onclick="teacher()">👩‍🏫 Panel docente</button><p class="small">Versión de prueba para GitHub Pages.</p></div>';
}
function entrar(){
  const n=document.querySelector("#nombre").value.trim();
  if(!n){alert("Escribe tu nombre.");return}
  U=n;getUser(U);save();navs();menu();
}
function menu(){
  const u=getUser(U),r=rank(u.xp);
  main.innerHTML=`<h2>¡Hola, ${esc(U)}!</h2><p class="desc">¿Qué quieres hacer?</p>
  <div class="card"><div class="big">${r[1]}</div><div class="word">${r[2]}</div><p>⭐ ${u.xp} puntos</p></div>
  <div class="grid"><button onclick="learn()">📖 Aprender</button><button onclick="memory()">🧠 Memoria</button><button onclick="trivia()">❓ Trivia</button><button onclick="phrases()">🧩 Frases</button><button onclick="progress()">⭐ Progreso</button><button onclick="teacher()">👩‍🏫 Docente</button></div>
  <button style="width:100%;margin-top:10px" onclick="login()">🚪 Cambiar jugador</button>`;
}
function learn(){
  let i=0;
  function f(){
    const s=S[i];
    main.innerHTML=`<h2>Aprender señas</h2><p>${i+1} de ${S.length}</p><div class="card"><div class="big">${s.p}</div><div class="word">${esc(s.w.toUpperCase())}</div><p class="desc">🤟 ${esc(s.d)}</p></div><div class="row"><button onclick="i=(i+S.length-1)%S.length;f()">⬅ Anterior</button><button onclick="i=(i+1)%S.length;f()">Siguiente ➡</button></div>`;
  } f();
}
function memory(){
  const pool=[...S].sort(()=>Math.random()-.5).slice(0,4);
  mem=[];
  pool.forEach((s,i)=>{mem.push({k:i,t:"p",s},{k:i,t:"d",s})});
  mem.sort(()=>Math.random()-.5);
  let sel=[],ok=0,tries=0,lock=false;
  main.innerHTML=`<h2>Memoria</h2><p>Une el emoji con la explicación.</p><div class="grid">${mem.map((_,i)=>`<button class="mc" id="m${i}">❓</button>`).join("")}</div>`;
  function show(i){const x=mem[i],b=document.querySelector("#m"+i);b.innerHTML=x.t==="p"?`${x.s.p}<br>${esc(x.s.w)}`:"🤟 "+esc(x.s.d)}
  mem.forEach((_,i)=>document.querySelector("#m"+i).onclick=()=>{
    if(lock||sel.includes(i))return; show(i); sel.push(i);
    if(sel.length<2)return;
    tries++; const [a,b]=sel;
    if(mem[a].k===mem[b].k){
      [a,b].forEach(j=>document.querySelector("#m"+j).classList.add("ok"));sel=[];ok++;
      if(ok===mem.length/2)setTimeout(()=>finish("Memoria",ok,tries,ok*10),500);
    }else{
      lock=true;setTimeout(()=>{[a,b].forEach(j=>{let z=document.querySelector("#m"+j);z.innerHTML="❓";z.className="mc"});sel=[];lock=false},700);
    }
  });
}
function trivia(){
  const pool=[...S].sort(()=>Math.random()-.5).slice(0,5);
  triv=pool.map(sign=>{
    const others=[...S].filter(x=>x.id!==sign.id).sort(()=>Math.random()-.5).slice(0,3);
    return {sign,options:[sign,...others].sort(()=>Math.random()-.5)};
  });
  let i=0,ok=0;
  function f(){
    const q=triv[i];
    main.innerHTML=`<h2>Trivia ${i+1}/${triv.length}</h2><div class="card"><div class="big">${q.sign.p}</div><p class="desc">🤟 ${esc(q.sign.d)}</p></div><div class="grid">${q.options.map((x,j)=>`<button id="t${j}">${x.p} ${esc(x.w)}</button>`).join("")}</div>`;
    q.options.forEach((x,j)=>document.querySelector("#t"+j).onclick=()=>{
      q.options.forEach((z,k)=>document.querySelector("#t"+k).disabled=true);
      if(x.w===q.sign.w){ok++;document.querySelector("#t"+j).classList.add("ok")}
      else document.querySelector("#t"+j).classList.add("bad");
      setTimeout(()=>{if(++i<triv.length)f();else finish("Trivia",ok,triv.length,ok*10)},700);
    });
  } f();
}
function makePhrase(){
  const raw=PHRASES[Math.floor(Math.random()*PHRASES.length)];
  const words=raw.map(w=>S.find(s=>s.w===w)||{w,p:"🔹",d:"Palabra"});
  const options=[...words].sort(()=>Math.random()-.5);
  return {words,options};
}
function phrases(){
  phr=[makePhrase(),makePhrase(),makePhrase()];
  let i=0,ok=0;
  function f(){
    const q=phr[i],chosen=[];
    main.innerHTML=`<h2>Arma la frase ${i+1}/${phr.length}</h2><div class="card"><div class="big" style="font-size:40px">${q.words.map(x=>x.p).join(" ➜ ")}</div></div><div class="out" id="out">&nbsp;</div><div class="row">${q.options.map((x,j)=>`<button id="p${j}">${x.p} ${esc(x.w)}</button>`).join("")}</div>`;
    q.options.forEach((x,j)=>document.querySelector("#p"+j).onclick=()=>{
      document.querySelector("#p"+j).disabled=true;chosen.push(x.w);document.querySelector("#out").textContent=chosen.join(" ");
      if(chosen.length===q.words.length){
        const good=chosen.join("|")===q.words.map(x=>x.w).join("|");
        document.querySelector("#out").classList.add(good?"ok":"bad");
        if(good)ok++;
        setTimeout(()=>{if(++i<phr.length)f();else finish("Frases",ok,phr.length,ok*5*3)},800);
      }
    });
  } f();
}
function finish(a,p,t,xp){
  addXP(xp,a,p,t);
  main.innerHTML=`<div class="card"><h2>¡Muy bien, ${esc(U)}!</h2><div class="big">${"⭐".repeat(p/t>=.8?3:p/t>=.5?2:1)}</div><p>${a}: ${p}/${t}</p><p><b>⭐ +${xp} puntos</b></p></div><button style="width:100%" onclick="menu()">🏠 Menú</button>`;
}
function progress(){
  const u=getUser(U),r=rank(u.xp);
  main.innerHTML=`<h2>⭐ Mi progreso</h2><div class="card"><div class="big">${r[1]}</div><div class="word">${r[2]}</div><p>⭐ ${u.xp} puntos</p></div>`+
  (u.log.length?`<div class="card"><table><tr><th>Fecha</th><th>Actividad</th><th>Resultado</th><th>XP</th></tr>${u.log.map(x=>`<tr><td>${esc(x.d)}</td><td>${esc(x.a)}</td><td>${x.p}/${x.t}</td><td>+${x.xp}</td></tr>`).join("")}</table></div>`:`<div class="card">Aún no has jugado.</div>`);
}
function teacher(){
  main.innerHTML=`<div class="card"><h2>👩‍🏫 Panel docente</h2><input id="pin" type="password" placeholder="PIN"><button onclick="checkTeacher()">Entrar</button><button style="margin-top:10px" onclick="${U?'menu()':'login()'}">Volver</button><p class="small">PIN de prueba: 1234</p></div>`;
}
function checkTeacher(){
  if(document.querySelector("#pin").value==="1234")panel();else alert("PIN incorrecto");
}
function panel(){
  const users=Object.values(DB.users);
  main.innerHTML=`<h2>👩‍🏫 Panel docente</h2>
  <div class="card"><b>📚 Señas (${S.length})</b><table>${S.map((s,i)=>`<tr><td>${s.p} ${esc(s.w)}</td><td><button onclick="delSign(${i})">🗑</button></td></tr>`).join("")}</table></div>
  <div class="card"><b>➕ Nueva seña</b><input id="nw" placeholder="Palabra"><input id="np" placeholder="Emoji"><input id="nd" placeholder="Cómo se hace"><button onclick="addSign()">Agregar</button></div>
  <div class="card"><b>📊 Progreso del grupo</b><table><tr><th>Alumno</th><th>Activ.</th><th>Prom.</th><th>Rango</th></tr>${users.map(x=>{const avg=x.log.length?Math.round(x.log.reduce((a,b)=>a+(b.p/b.t*100),0)/x.log.length):0;const r=rank(x.xp);return `<tr><td>${esc(x.name)}</td><td>${x.log.length}</td><td>${avg}%</td><td>${r[2]}</td></tr>`}).join("")}</table><button style="width:100%;margin-top:10px" onclick="exportCSV()">📄 Exportar CSV</button></div>
  <button style="width:100%" onclick="${U?'menu()':'login()'}">Salir</button>`;
}
function addSign(){
  const w=document.querySelector("#nw").value.trim(),p=document.querySelector("#np").value.trim(),d=document.querySelector("#nd").value.trim();
  if(!w||!p||!d){alert("Completa los tres campos.");return}
  S.push({id:Date.now(),w,p,d});panel();
}
function delSign(i){
  if(S.length<=1){alert("Debe quedar al menos una seña.");return}
  if(confirm("¿Eliminar la seña "+S[i].w+"?")){S.splice(i,1);panel();}
}
function exportCSV(){
  const rows=[["Alumno","Fecha","Actividad","Correctas","Total","XP"]];
  Object.values(DB.users).forEach(u=>u.log.forEach(x=>rows.push([u.name,x.d,x.a,x.p,x.t,x.xp])));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="manos_que_hablan_progreso.csv";a.click();URL.revokeObjectURL(a.href);
}
document.querySelector("#tema").onclick=()=>{
  document.body.style.filter=document.body.style.filter?"":"invert(.9)";
};
login();
</script>
</body>
</html>
