<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manos que hablan</title>
<style>
:root{--bg:#eef4ff;--card:#fff;--tx:#0b1f3a;--ac:#ffd400;--ok:#2ecc71;--bad:#ff5252;--nav:#dbe7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,sans-serif}
#app{max-width:480px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;background:var(--nav);display:flex;justify-content:space-between;font-size:20px}
#main{padding:8px 16px 20px;flex:1}h2{color:var(--ac)}.card{background:var(--card);border-radius:18px;padding:16px;text-align:center;margin:10px 0}
.big{font-size:64px}.word{font-size:32px;font-weight:bold;color:var(--ac)}.desc{font-size:18px;line-height:1.4}
button{border:0;border-radius:14px;padding:13px;background:var(--ac);font-weight:bold;font-size:17px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
input{width:100%;padding:12px;font-size:20px;border:2px solid var(--ac);border-radius:12px;margin:5px 0}
nav{position:sticky;bottom:0;background:var(--nav);padding:7px;display:flex;justify-content:space-around}nav button{background:transparent}
.mc{min-height:90px;font-size:25px}.ok{background:var(--ok)!important}.bad{background:var(--bad)!important}
.out{background:var(--card);padding:12px;border-radius:12px;text-align:center;font-size:22px;margin:10px 0}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #aaa;text-align:left}
</style>
</head>
<body><div id="app"><header><b>🤟 Manos que hablan</b><button id="tema">🌙</button></header><main id="main"></main><nav id="nav" hidden></nav></div>
<script>
let S=[],U=null,R=[],log=[],mem=null,triv=null,phr=null;
const main=document.querySelector("#main"),nav=document.querySelector("#nav");
async function api(url,opt={}){let r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});let d=await r.json();if(d.error)throw Error(d.error);return d}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function navs(){if(!U){nav.hidden=true;return}nav.hidden=false;nav.innerHTML=`<button onclick="menu()">🏠</button><button onclick="learn()">📖</button><button onclick="memory()">🧠</button><button onclick="trivia()">❓</button><button onclick="phrases()">🧩</button><button onclick="progress()">⭐</button>`}
async function init(){let d=await api("/api/init");S=d.signs;R=d.ranks;login()}
function rank(x){let r=R[0];for(const a of R)if(x>=a[0])r=a;return r}
async function login(){U=null;navs();main.innerHTML=`<div class=card><div class=big>🤟</div><h2>¡Bienvenido!</h2><p class=desc>Aprende señas jugando</p><input id=nombre placeholder="Tu nombre" maxlength=20><button style="width:100%" onclick="entrar()">▶ Entrar</button><button style="width:100%;margin-top:12px" onclick="teacher()">👩‍🏫 Panel docente</button></div>`}
async function entrar(){let n=document.querySelector("#nombre").value.trim();if(!n)return;let d=await api("/api/login",{method:"POST",body:JSON.stringify({name:n})});U=d.name;log=d.log;navs();menu()}
function card(){let x=log.length?undefined:0;let d=U?null:null;return ""}
async function user(){return api("/api/user?name="+encodeURIComponent(U))}
async function menu(){let d=await user(),r=d.rank;main.innerHTML=`<h2>¡Hola, ${esc(U)}!</h2><p class=desc>¿Qué quieres hacer?</p><div class=card><div class=big>${r.icon}</div><div class=word>${r.name}</div><p>⭐ ${d.xp} puntos</p></div><div class=grid>${[['learn','📖 Aprender'],['memory','🧠 Memoria'],['trivia','❓ Trivia'],['phrases','🧩 Frases'],['progress','⭐ Progreso']].map(x=>`<button onclick="${x[0]}()">${x[1]}</button>`).join("")}</div><button style="width:100%;margin-top:10px" onclick="login()">🚪 Cambiar jugador</button>`}
function learn(){let i=0;function f(){let s=S[i];main.innerHTML=`<h2>Aprender señas</h2><p>${i+1} de ${S.length}</p><div class=card><div class=big>${s.p}</div><div class=word>${esc(s.w.toUpperCase())}</div><p class=desc>🤟 ${esc(s.d)}</p></div><div class=row><button onclick="i=(i+S.length-1)%S.length;f()">⬅ Anterior</button><button onclick="i=(i+1)%S.length;f()">Siguiente ➡</button></div>`}f()}
async function memory(){let d=await api("/api/memory",{method:"POST",body:JSON.stringify({name:U})});mem=d.cards;let sel=[],ok=0,tries=0,lock=false;main.innerHTML=`<h2>Memoria</h2><p>Une el emoji con la explicación.</p><div class=grid>${mem.map((_,i)=>`<button class=mc id=m${i}>❓</button>`).join("")}</div>`;
function show(i){let x=mem[i],b=document.querySelector("#m"+i);b.innerHTML=x.t==="p"?`${x.s.p}<br>${esc(x.s.w)}`:"🤟 "+esc(x.s.d)}
mem.forEach((_,i)=>document.querySelector("#m"+i).onclick=()=>{if(lock||sel.includes(i))return;show(i);sel.push(i);if(sel.length<2)return;tries++;let[a,b]=sel;if(mem[a].k===mem[b].k){[a,b].forEach(j=>document.querySelector("#m"+j).classList.add("ok"));sel=[];ok++;if(ok===mem.length/2)setTimeout(()=>finish("Memoria",ok,tries,ok*10),500)}else{lock=true;setTimeout(()=>{[a,b].forEach(j=>{let z=document.querySelector("#m"+j);z.innerHTML="❓";z.className="mc"});sel=[];lock=false},700)}})}
async function trivia(){let d=await api("/api/trivia",{method:"POST",body:JSON.stringify({name:U})});triv=d.questions;let i=0,ok=0;function f(){let q=triv[i];main.innerHTML=`<h2>Trivia ${i+1}/${triv.length}</h2><div class=card><div class=big>${q.sign.p}</div><p class=desc>🤟 ${esc(q.sign.d)}</p></div><div class=grid>${q.options.map((x,j)=>`<button id=t${j}>${x.p} ${esc(x.w)}</button>`).join("")}</div>`;q.options.forEach((x,j)=>document.querySelector("#t"+j).onclick=()=>{q.options.forEach((z,k)=>document.querySelector("#t"+k).disabled=true);if(x.w===q.sign.w){ok++;document.querySelector("#t"+j).classList.add("ok")}else document.querySelector("#t"+j).classList.add("bad");setTimeout(()=>{if(++i<triv.length)f();else finish("Trivia",ok,triv.length,ok*10)},700)})}f()}
async function phrases(){let d=await api("/api/phrase",{method:"POST",body:JSON.stringify({name:U})});phr=d.phrases;let i=0,ok=0;function f(){let q=phr[i],chosen=[];main.innerHTML=`<h2>Arma la frase ${i+1}/${phr.length}</h2><div class=card><div class=big style="font-size:40px">${q.words.map(x=>x.p).join(" ➜ ")}</div></div><div class=out id=out>&nbsp;</div><div class=row>${q.options.map((x,j)=>`<button id=p${j}>${x.p} ${esc(x.w)}</button>`).join("")}</div>`;q.options.forEach((x,j)=>document.querySelector("#p"+j).onclick=()=>{document.querySelector("#p"+j).disabled=true;chosen.push(x.w);document.querySelector("#out").textContent=chosen.join(" ");if(chosen.length===q.words.length){let good=chosen.join("|")===q.words.map(x=>x.w).join("|");document.querySelector("#out").classList.add(good?"ok":"bad");if(good)ok++;setTimeout(()=>{if(good&&++i<phr.length)f();else if(good)finish("Frases",ok,phr.length,ok*q.words.length*5);else f()},800)}})}f()}
async function finish(a,p,t,xp){let d=await api("/api/finish",{method:"POST",body:JSON.stringify({name:U,activity:a,correct:p,total:t,xp})});log=d.log;main.innerHTML=`<div class=card><h2>¡Muy bien, ${esc(U)}!</h2><div class=big>${"⭐".repeat(p/t>=.8?3:p/t>=.5?2:1)}</div><p>${a}: ${p}/${t}</p><p><b>⭐ +${xp} puntos</b></p></div><button style="width:100%" onclick="menu()">🏠 Menú</button>`}
async function progress(){let d=await user(),r=d.rank;main.innerHTML=`<h2>⭐ Mi progreso</h2><div class=card><div class=big>${r.icon}</div><div class=word>${r.name}</div><p>⭐ ${d.xp} puntos</p></div>`+(d.log.length?`<div class=card><table><tr><th>Fecha</th><th>Actividad</th><th>Resultado</th></tr>${d.log.map(x=>`<tr><td>${x.d}</td><td>${x.a}</td><td>${x.p}/${x.t}</td></tr>`).join("")}</table></div>`:`<div class=card>Aún no has jugado.</div>`)}
async function teacher(){main.innerHTML=`<div class=card><h2>👩‍🏫 Panel docente</h2><input id=pin type=password placeholder="PIN"><button onclick="checkTeacher()">Entrar</button><button style="margin-top:10px" onclick="login()">Volver</button></div>`}
function checkTeacher(){if(document.querySelector("#pin").value==="1234")panel();else alert("PIN incorrecto")}
async function panel(){let d=await api("/api/teacher");main.innerHTML=`<h2>👩‍🏫 Panel docente</h2><div class=card><b>📚 Señas (${d.signs.length})</b><table>${d.signs.map((s,i)=>`<tr><td>${s.p} ${esc(s.w)}</td><td><button onclick="delSign(${i})">🗑</button></td></tr>`).join("")}</table></div><div class=card><b>➕ Nueva seña</b><input id=nw placeholder="Palabra"><input id=np placeholder="Emoji"><input id=nd placeholder="Cómo se hace"><button onclick="addSign()">Agregar</button></div><div class=card><b>📊 Progreso del grupo</b><table><tr><th>Alumno</th><th>Activ.</th><th>Prom.</th><th>Rango</th></tr>${d.group.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.activities}</td><td>${x.average}%</td><td>${x.rank.name}</td></tr>`).join("")}</table><button style="width:100%;margin-top:10px" onclick="location='/api/export'">📄 Exportar CSV</button></div><button style="width:100%" onclick="${U?'menu()':'login()'}">Salir</button>`}
async function addSign(){let d=await api("/api/sign/add",{method:"POST",body:JSON.stringify({word:nw.value,emoji:np.value,description:nd.value})});S=d.signs;panel()}
async function delSign(i){let d=await api("/api/sign/delete",{method:"POST",body:JSON.stringify({index:i})});S=d.signs;panel()}
document.querySelector("#tema").onclick=()=>document.body.style.filter=document.body.style.filter?"":"invert(.9)";
init();
</script></body></html>
